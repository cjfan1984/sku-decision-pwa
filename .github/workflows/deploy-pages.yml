name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Zero-GPT SKU Data Sync"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate encrypted production structure
        run: python tools/validate_deploy.py
      - name: Detect keyed validation availability
        id: keyed_validation
        env:
          PWA_APP_KEY: ${{ secrets.PWA_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PWA_APP_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned decryption dependency
        if: steps.keyed_validation.outputs.enabled == 'true'
        run: pip install cryptography==45.0.6
      - name: Verify production key and decrypted record count
        if: steps.keyed_validation.outputs.enabled == 'true'
        env:
          PWA_APP_KEY: ${{ secrets.PWA_APP_KEY }}
        run: python tools/validate_deploy.py --key-env PWA_APP_KEY
      - name: Stage public runtime only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png app.enc.json pwa-data-version.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
